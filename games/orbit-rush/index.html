<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#091017" />
  <title>Orbit Rush</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="../../ui-enhancements.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">GAME MUSIC LAB / 02</p>
        <h1>Orbit Rush</h1>
      </div>
      <button id="soundButton" class="icon-button" type="button" aria-label="サウンド一括切り替え" aria-pressed="true">♪</button>
    </header>

    <nav class="game-nav" aria-label="ゲーム選択">
      <a href="../../">01 Mystic</a>
      <span class="game-nav-current">02 Orbit</span>
      <a href="../pulse-forge/">03 Pulse</a>
      <a href="../rune-relay/">04 Rune</a>
      <a href="../aether-shift/">05 Aether</a>
      <a href="../../settings/music/">⚙ Settings</a>
    </nav>

    <section class="status-panel" aria-label="ゲーム状況">
      <div class="status-item"><span class="status-label">TIME</span><strong id="timeValue">30.0</strong></div>
      <div class="status-item"><span class="status-label">SCORE</span><strong id="scoreValue">0</strong></div>
      <div class="status-item"><span class="status-label">COMBO</span><strong id="comboValue">0</strong></div>
      <div class="status-item"><span class="status-label">BEST</span><strong id="bestValue">—</strong></div>
    </section>

    <section class="audio-panel" aria-label="音楽設定">
      <div class="now-playing"><span>NOW PLAYING</span><strong id="musicState">READY · music stopped</strong></div>
      <div class="audio-row">
        <label><input id="bgmToggle" type="checkbox" checked /> BGM</label>
        <input id="bgmVolume" type="range" min="0" max="100" value="78" aria-label="BGM音量" />
        <output id="bgmVolumeValue">78</output>
      </div>
      <div class="audio-row">
        <label><input id="sfxToggle" type="checkbox" checked /> SE</label>
        <input id="sfxVolume" type="range" min="0" max="100" value="76" aria-label="SE音量" />
        <output id="sfxVolumeValue">76</output>
      </div>
    </section>

    <section class="game-area">
      <div id="gameMessage" class="game-message" role="status">
        <span class="message-kicker">REACTION GAME</span>
        <strong>光った軌道をタップ</strong>
        <span>30秒間、ターゲットを追い続けよう。</span>
      </div>
      <div id="orbitGrid" class="orbit-grid" aria-label="タップ盤面"></div>
    </section>

    <footer class="controls">
      <button id="startButton" class="primary-button" type="button">ゲーム開始</button>
      <p class="hint">正解でコンボ上昇。間違えるとコンボが0になります。</p>
    </footer>
  </main>

  <div id="resultOverlay" class="overlay" hidden>
    <section class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <p class="eyebrow">RESULT</p>
      <h2 id="resultTitle">FINISH!</h2>
      <p id="resultMessage" class="result-message"></p>
      <div class="result-score"><span>SCORE</span><strong id="finalScore">0</strong></div>
      <div class="result-stats">
        <div><span>MAX COMBO</span><strong id="maxComboValue">0</strong></div>
        <div><span>HITS</span><strong id="hitsValue">0</strong></div>
      </div>
      <button id="retryButton" class="primary-button" type="button">もう一度</button>
    </section>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
