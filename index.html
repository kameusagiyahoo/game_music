<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#151515" />
  <title>Mystic Match</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="ui-enhancements.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">GAME MUSIC LAB / 01</p>
        <h1>Mystic Match</h1>
      </div>
      <button id="soundButton" class="icon-button" type="button" aria-label="サウンド一括切り替え" aria-pressed="true">♪</button>
    </header>

    <nav class="game-nav" aria-label="ゲーム選択">
      <span class="game-nav-current">01 Mystic Match</span>
      <a href="games/orbit-rush/">02 Orbit</a>
      <a href="games/pulse-forge/">03 Pulse</a>
      <a href="games/rune-relay/">04 Rune</a>
      <a href="games/aether-shift/">05 Aether</a>
      <a href="games/beat-claim/">06 Claim</a>
      <a href="games/sync-circuit/">07 Sync</a>
      <a href="settings/music/">⚙ Settings</a>
    </nav>

    <section class="status-panel" aria-label="ゲーム状況">
      <div class="status-item"><span class="status-label">TIME</span><strong id="timeValue">45.0</strong></div>
      <div class="status-item"><span class="status-label">MOVES</span><strong id="movesValue">0</strong></div>
      <div class="status-item"><span class="status-label">PAIRS</span><strong><span id="pairsValue">0</span>/6</strong></div>
      <div class="status-item"><span class="status-label">BEST</span><strong id="bestValue">—</strong></div>
    </section>

    <section class="audio-panel" aria-label="音楽設定">
      <div class="now-playing">
        <span>NOW PLAYING</span>
        <strong id="musicState">READY · music stopped</strong>
      </div>
      <div class="audio-row">
        <label><input id="bgmToggle" type="checkbox" checked /> BGM</label>
        <input id="bgmVolume" type="range" min="0" max="100" value="82" aria-label="BGM音量" />
        <output id="bgmVolumeValue">82</output>
      </div>
      <div class="audio-row">
        <label><input id="sfxToggle" type="checkbox" checked /> SE</label>
        <input id="sfxVolume" type="range" min="0" max="100" value="72" aria-label="SE音量" />
        <output id="sfxVolumeValue">72</output>
      </div>
    </section>

    <section class="game-area">
      <div id="gameMessage" class="game-message" role="status">
        <span class="message-kicker">MEMORY GAME</span>
        <strong>同じ紋章を見つけよう</strong>
        <span>45秒以内に6組すべて揃えればクリア。</span>
      </div>
      <div id="board" class="board" aria-label="カード盤面"></div>
    </section>

    <footer class="controls">
      <button id="startButton" class="primary-button" type="button">ゲーム開始</button>
      <p id="hintText" class="hint">カードの位置を覚えて、できるだけ少ない手数で揃えよう。</p>
    </footer>
  </main>

  <div id="resultOverlay" class="overlay" hidden>
    <section class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <p class="eyebrow">RESULT</p>
      <h2 id="resultTitle">CLEAR!</h2>
      <p id="resultMessage" class="result-message"></p>
      <div class="result-score"><span>SCORE</span><strong id="scoreValue">0</strong></div>
      <div class="result-stats">
        <div><span>TIME</span><strong id="resultTime">0.0s</strong></div>
        <div><span>MOVES</span><strong id="resultMoves">0</strong></div>
      </div>
      <button id="retryButton" class="primary-button" type="button">もう一度</button>
    </section>
  </div>

  <script type="module" src="src/game.js"></script>
</body>
</html>
