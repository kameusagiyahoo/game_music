name: Generate Pulse WAV stems

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/generate_pulse_stems.py"
      - ".github/workflows/generate-pulse-stems.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate synchronized WAV stems
        run: python tools/generate_pulse_stems.py
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stems/pulse/*.wav
          if git diff --cached --quiet; then
            echo "WAV stems already up to date"
          else
            git commit -m "Generate synchronized Pulse WAV stems"
            git push
          fi
