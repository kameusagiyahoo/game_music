name: Generate Pulse multi-format audio

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/generate_pulse_stems.py"
      - "src/music-packs/pulse.js"
      - ".github/workflows/generate-pulse-stems.yml"

permissions:
  contents: write

concurrency:
  group: pulse-audio-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate synchronized WAV stems and stingers
        run: python tools/generate_pulse_stems.py
      - name: Encode OGG and AAC/M4A variants
        run: |
          set -euo pipefail
          for src in assets/stems/pulse/*.wav; do
            base="${src%.wav}"
            ffmpeg -y -loglevel error -i "$src" -ar 44100 -ac 2 -c:a libvorbis -q:a 5 "${base}.ogg"
            ffmpeg -y -loglevel error -i "$src" -ar 44100 -ac 2 -c:a aac -b:a 160k -movflags +faststart "${base}.m4a"
          done
          for src in assets/stingers/pulse/*.wav; do
            base="${src%.wav}"
            ffmpeg -y -loglevel error -i "$src" -ar 44100 -ac 2 -c:a libvorbis -q:a 5 "${base}.ogg"
            ffmpeg -y -loglevel error -i "$src" -ar 44100 -ac 2 -c:a aac -b:a 160k -movflags +faststart "${base}.m4a"
          done
          for src in assets/transitions/pulse/*.wav; do
            base="${src%.wav}"
            ffmpeg -y -loglevel error -i "$src" -ar 44100 -ac 2 -c:a libvorbis -q:a 5 "${base}.ogg"
            ffmpeg -y -loglevel error -i "$src" -ar 44100 -ac 2 -c:a aac -b:a 160k -movflags +faststart "${base}.m4a"
          done
      - name: Validate generated audio profile
        run: |
          set -euo pipefail
          for src in assets/stems/pulse/*.{wav,ogg,m4a} assets/stingers/pulse/*.{wav,ogg,m4a} assets/transitions/pulse/*.{wav,ogg,m4a}; do
            sample_rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 "$src")"
            channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=noprint_wrappers=1:nokey=1 "$src")"
            if [ "$sample_rate" != "44100" ] || [ "$channels" != "2" ]; then
              echo "Invalid audio profile: $src sample_rate=$sample_rate channels=$channels"
              exit 1
            fi
          done
          echo "All Pulse audio assets are 44.1 kHz stereo"
      - name: Commit generated audio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stems/pulse/*.{wav,ogg,m4a}
          git add assets/stingers/pulse/*.{wav,ogg,m4a}
          git add assets/transitions/pulse/*.{wav,ogg,m4a}
          if git diff --cached --quiet; then
            echo "Pulse audio already up to date"
            exit 0
          fi
          git commit -m "Generate Pulse multi-format audio"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
