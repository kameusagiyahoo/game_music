name: Generate Pulse multi-format audio

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/generate_pulse_stems.py"
      - "src/music-packs/pulse.js"
      - ".github/workflows/generate-pulse-stems.yml"

permissions:
  contents: write

concurrency:
  group: pulse-audio-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate synchronized WAV stems and stingers
        run: python tools/generate_pulse_stems.py
      - name: Encode OGG and AAC/M4A variants
        run: |
          set -euo pipefail
          for src in assets/stems/pulse/*.wav; do
            base="${src%.wav}"
            ffmpeg -y -loglevel error -i "$src" -c:a libvorbis -q:a 4 "${base}.ogg"
            ffmpeg -y -loglevel error -i "$src" -c:a aac -b:a 128k "${base}.m4a"
          done
          for src in assets/stingers/pulse/*.wav; do
            base="${src%.wav}"
            ffmpeg -y -loglevel error -i "$src" -c:a libvorbis -q:a 4 "${base}.ogg"
            ffmpeg -y -loglevel error -i "$src" -c:a aac -b:a 128k "${base}.m4a"
          done
      - name: Commit generated audio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stems/pulse/*.{wav,ogg,m4a}
          git add assets/stingers/pulse/*.{wav,ogg,m4a}
          if git diff --cached --quiet; then
            echo "Pulse audio already up to date"
            exit 0
          fi
          git commit -m "Generate Pulse multi-format audio"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
