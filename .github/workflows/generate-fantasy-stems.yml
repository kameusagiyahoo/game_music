name: Generate Fantasy multi-format audio

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/generate_fantasy_stems.py"
      - "tools/encode_fantasy_audio.sh"

permissions:
  contents: write

concurrency:
  group: fantasy-audio-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate Fantasy WAV stems, stingers and transitions
        run: python tools/generate_fantasy_stems.py
      - name: Validate Fantasy WAV profile
        run: python tools/check_fantasy_audio_profile.py
      - name: Encode Fantasy OGG and AAC/M4A variants
        run: bash tools/encode_fantasy_audio.sh
      - name: Validate generated format profile
        run: |
          set -euo pipefail
          for src in assets/stems/fantasy/*.{wav,ogg,m4a} assets/stingers/fantasy/*.{wav,ogg,m4a} assets/transitions/fantasy/*.{wav,ogg,m4a}; do
            sample_rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 "$src")"
            channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=noprint_wrappers=1:nokey=1 "$src")"
            if [ "$sample_rate" != "44100" ] || [ "$channels" != "2" ]; then
              echo "Invalid Fantasy audio profile: $src sample_rate=$sample_rate channels=$channels"
              exit 1
            fi
          done
          echo "All Fantasy audio assets are 44.1 kHz stereo"
      - name: Validate decoded cross-format parity
        run: python tools/check_fantasy_format_parity.py
      - name: Validate format parity gate semantics
        run: python tools/check_fantasy_format_parity_semantics.py
      - name: Commit generated Fantasy audio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stems/fantasy/*.{wav,ogg,m4a}
          git add assets/stingers/fantasy/*.{wav,ogg,m4a}
          git add assets/transitions/fantasy/*.{wav,ogg,m4a}
          if git diff --cached --quiet; then
            echo "Fantasy audio already up to date"
            exit 0
          fi
          git commit -m "Generate Fantasy multi-format audio"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
