name: Neon Audio Format Parity

on:
  push:
    paths:
      - "assets/stems/neon/**"
      - "assets/stingers/neon/**"
      - "assets/transitions/neon/**"
      - "tools/check_neon_format_parity.py"
      - "tools/check_neon_format_parity_semantics.py"
      - "tools/check_pulse_format_parity.py"
      - ".github/workflows/neon-format-parity.yml"
  pull_request:
    paths:
      - "assets/stems/neon/**"
      - "assets/stingers/neon/**"
      - "assets/transitions/neon/**"
      - "tools/check_neon_format_parity.py"
      - "tools/check_neon_format_parity_semantics.py"
      - "tools/check_pulse_format_parity.py"
      - ".github/workflows/neon-format-parity.yml"
  workflow_dispatch:

concurrency:
  group: neon-format-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check decoded Neon cross-format parity
        run: python tools/check_neon_format_parity.py
      - name: Check Neon parity gate semantics
        run: python tools/check_neon_format_parity_semantics.py
      - name: Upload Neon Format Parity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-format-parity-report
          path: qa/out/neon-format-parity.json
          if-no-files-found: ignore
          retention-days: 14
