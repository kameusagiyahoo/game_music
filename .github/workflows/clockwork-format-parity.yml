name: Clockwork Audio Format Parity

on:
  push:
    paths:
      - "assets/stems/clockwork/**"
      - "assets/stingers/clockwork/**"
      - "assets/transitions/clockwork/**"
      - "tools/check_clockwork_format_parity.py"
      - "tools/check_clockwork_format_parity_semantics.py"
      - "tools/check_pulse_format_parity.py"
      - ".github/workflows/clockwork-format-parity.yml"
  pull_request:
    paths:
      - "assets/stems/clockwork/**"
      - "assets/stingers/clockwork/**"
      - "assets/transitions/clockwork/**"
      - "tools/check_clockwork_format_parity.py"
      - "tools/check_clockwork_format_parity_semantics.py"
      - "tools/check_pulse_format_parity.py"
      - ".github/workflows/clockwork-format-parity.yml"
  workflow_dispatch:

concurrency:
  group: clockwork-format-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check decoded Clockwork cross-format parity
        run: python tools/check_clockwork_format_parity.py
      - name: Check Clockwork parity gate semantics
        run: python tools/check_clockwork_format_parity_semantics.py
      - name: Upload Clockwork Format Parity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clockwork-format-parity-report
          path: qa/out/clockwork-format-parity.json
          if-no-files-found: ignore
          retention-days: 14
