name: Music Architecture Check

on:
  push:
    paths:
      - "src/**"
      - "games/**"
      - "debug/**"
      - "settings/**"
      - "tools/**"
      - "qa/baselines/**"
      - "music-sw.js"
      - ".github/workflows/music-architecture-check.yml"
  pull_request:
    paths:
      - "src/**"
      - "games/**"
      - "debug/**"
      - "settings/**"
      - "tools/**"
      - "qa/baselines/**"
      - "music-sw.js"
      - ".github/workflows/music-architecture-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce Music Facade boundary
        run: python tools/check_music_boundary.py
      - name: Check audio encoder shell syntax
        run: |
          bash -n tools/encode_pulse_audio.sh
          bash -n tools/encode_fantasy_audio.sh
          bash -n tools/encode_neon_audio.sh
          bash -n tools/encode_clockwork_audio.sh
      - name: Check JavaScript syntax
        run: python tools/check_js_syntax.py
      - name: Check Music Pack manifests
        run: node tools/check_music_manifests.mjs
      - name: Check Music Format Resolver
        run: node tools/check_music_formats.mjs
      - name: Check Multi WAV Pack Registry
        run: node tools/check_music_multi_wav_packs.mjs
      - name: Check Runtime Decode Fallback
        run: node tools/check_music_runtime_fallback.mjs
      - name: Check Audio Preload Cache
        run: node tools/check_music_preload_cache.mjs
      - name: Check Persistent Audio Cache
        run: node tools/check_music_persistent_cache.mjs
      - name: Check Music Volume Controls
        run: node tools/check_music_volume_controls.mjs
      - name: Check Result State and Stinger Sync
        run: node tools/check_music_result_sync.mjs
      - name: Check Game Pack Preference Policy
        run: node tools/check_game_pack_preferences.mjs
      - name: Check Beat and Bar Quantization
        run: node tools/check_music_quantization.mjs
      - name: Check Real Audio Pack Hot Swap
        run: node tools/check_music_pack_hot_swap.mjs
      - name: Check Equal-Power Pack Crossfade
        run: node tools/check_music_equal_power_crossfade.mjs
      - name: Check Hot Swap Realtime QA Integration
        run: node tools/check_music_hot_swap_qa.mjs
      - name: Check Transition Cue Engine
        run: node tools/check_music_transition_cues.mjs
      - name: Check Runtime Mastering Graph
        run: node tools/check_music_mastering.mjs
      - name: Check Fantasy Runtime Mastering
        run: node tools/check_music_fantasy_mastering.mjs
      - name: Check Neon Runtime Mastering
        run: node tools/check_music_neon_mastering.mjs
      - name: Check Clockwork Runtime Mastering
        run: node tools/check_music_clockwork_mastering.mjs
      - name: Check Realtime Audio Meter
        run: node tools/check_music_metering.mjs
      - name: Check QA Session Reports
        run: node tools/check_music_qa_report.mjs
      - name: Check QA Baseline Regression Compare
        run: node tools/check_music_qa_compare.mjs
      - name: Check Automated QA Scenario
        run: node tools/check_music_qa_scenario.mjs
      - name: Check Hot Swap Route Matrix Scenario
        run: node tools/check_music_qa_route_matrix.mjs
      - name: Check Device QA Baseline Registry
        run: node tools/check_music_qa_baseline_registry.mjs
      - name: Check Route Matrix Device Baseline Registry
        run: node tools/check_music_qa_route_baseline_registry.mjs
      - name: Check Golden QA + Publish Summary
        env:
          GOLDEN_QA_REPORT_PATH: qa/out/pulse-standard-v1-golden-report.json
        run: node tools/music_qa_golden.mjs --check
      - name: Upload Golden QA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-golden-qa-report
          path: qa/out/pulse-standard-v1-golden-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Golden QA Gate Semantics
        run: node tools/check_music_qa_golden.mjs
      - name: Check Fantasy Golden QA + Publish Summary
        env:
          GOLDEN_QA_REPORT_PATH: qa/out/fantasy-standard-v1-golden-report.json
        run: node tools/music_qa_golden_fantasy.mjs --check
      - name: Upload Fantasy Golden QA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-golden-qa-report
          path: qa/out/fantasy-standard-v1-golden-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Fantasy Golden QA Gate Semantics
        run: node tools/check_music_qa_golden_fantasy.mjs
      - name: Check Neon Golden QA + Publish Summary
        env:
          GOLDEN_QA_REPORT_PATH: qa/out/neon-standard-v1-golden-report.json
        run: node tools/music_qa_golden_neon.mjs --check
      - name: Upload Neon Golden QA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-golden-qa-report
          path: qa/out/neon-standard-v1-golden-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Neon Golden QA Gate Semantics
        run: node tools/check_music_qa_golden_neon.mjs
      - name: Check Clockwork Golden QA + Publish Summary
        env:
          GOLDEN_QA_REPORT_PATH: qa/out/clockwork-standard-v1-golden-report.json
        run: node tools/music_qa_golden_clockwork.mjs --check
      - name: Upload Clockwork Golden QA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clockwork-golden-qa-report
          path: qa/out/clockwork-standard-v1-golden-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Clockwork Golden QA Gate Semantics
        run: node tools/check_music_qa_golden_clockwork.mjs
      - name: Check Pulse Audio Profile
        run: python tools/check_pulse_audio_profile.py
      - name: Check Fantasy Audio Profile
        run: python tools/check_fantasy_audio_profile.py
      - name: Check Neon Audio Profile
        run: python tools/check_neon_audio_profile.py
      - name: Check Clockwork Audio Profile
        run: python tools/check_clockwork_audio_profile.py
      - name: Check Pulse Mastering
        run: python tools/check_pulse_mastering.py
