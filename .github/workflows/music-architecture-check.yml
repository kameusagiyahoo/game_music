name: Music Architecture Check

on:
  push:
    paths:
      - "src/**"
      - "games/**"
      - "debug/**"
      - "tools/check_music_boundary.py"
      - "tools/check_music_manifests.mjs"
      - "tools/check_music_formats.mjs"
      - "tools/check_music_runtime_fallback.mjs"
      - "tools/check_music_preload_cache.mjs"
      - "tools/check_music_persistent_cache.mjs"
      - "tools/check_music_quantization.mjs"
      - ".github/workflows/music-architecture-check.yml"
  pull_request:
    paths:
      - "src/**"
      - "games/**"
      - "debug/**"
      - "tools/check_music_boundary.py"
      - "tools/check_music_manifests.mjs"
      - "tools/check_music_formats.mjs"
      - "tools/check_music_runtime_fallback.mjs"
      - "tools/check_music_preload_cache.mjs"
      - "tools/check_music_persistent_cache.mjs"
      - "tools/check_music_quantization.mjs"
      - ".github/workflows/music-architecture-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce Music Facade boundary
        run: python tools/check_music_boundary.py
      - name: Check JavaScript syntax
        run: |
          node --check src/music-pack-manifest.js
          node --check src/audio-asset-cache.js
          node --check src/music-service-worker.js
          node --check music-sw.js
          node --check src/music-format-resolver.js
          node --check src/wav-stem-manager.js
          node --check src/music-registry.js
          node --check src/music-asset-resolver.js
          node --check src/music-facade.js
          node --check src/game.js
          node --check games/orbit-rush/game.js
          node --check games/pulse-forge/game.js
          node --check games/rune-relay/game.js
          node --check games/aether-shift/game.js
          node --check debug/resolver/resolver.js
          node --check debug/mixer/mixer.js
      - name: Check Music Pack manifests
        run: node tools/check_music_manifests.mjs
      - name: Check Music Format Resolver
        run: node tools/check_music_formats.mjs
      - name: Check Runtime Decode Fallback
        run: node tools/check_music_runtime_fallback.mjs
      - name: Check Audio Preload Cache
        run: node tools/check_music_preload_cache.mjs
      - name: Check Persistent Audio Cache
        run: node tools/check_music_persistent_cache.mjs
      - name: Check Beat and Bar Quantization
        run: node tools/check_music_quantization.mjs
