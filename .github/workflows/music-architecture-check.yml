name: Music Architecture Check

on:
  push:
    paths:
      - "src/**"
      - "games/**"
      - "debug/**"
      - "settings/**"
      - "tools/check_music_boundary.py"
      - "tools/check_music_manifests.mjs"
      - "tools/check_music_formats.mjs"
      - "tools/check_music_runtime_fallback.mjs"
      - "tools/check_music_preload_cache.mjs"
      - "tools/check_music_persistent_cache.mjs"
      - "tools/check_music_quantization.mjs"
      - "tools/check_music_transition_cues.mjs"
      - "tools/check_music_mastering.mjs"
      - "tools/check_music_metering.mjs"
      - "tools/check_music_qa_report.mjs"
      - "tools/check_music_qa_compare.mjs"
      - "tools/check_music_qa_scenario.mjs"
      - "tools/music_qa_golden.mjs"
      - "tools/check_music_qa_golden.mjs"
      - "qa/baselines/**"
      - "tools/check_pulse_mastering.py"
      - "tools/check_pulse_audio_profile.py"
      - "tools/encode_pulse_audio.sh"
      - ".github/workflows/music-architecture-check.yml"
  pull_request:
    paths:
      - "src/**"
      - "games/**"
      - "debug/**"
      - "settings/**"
      - "tools/check_music_boundary.py"
      - "tools/check_music_manifests.mjs"
      - "tools/check_music_formats.mjs"
      - "tools/check_music_runtime_fallback.mjs"
      - "tools/check_music_preload_cache.mjs"
      - "tools/check_music_persistent_cache.mjs"
      - "tools/check_music_quantization.mjs"
      - "tools/check_music_transition_cues.mjs"
      - "tools/check_music_mastering.mjs"
      - "tools/check_music_metering.mjs"
      - "tools/check_music_qa_report.mjs"
      - "tools/check_music_qa_compare.mjs"
      - "tools/check_music_qa_scenario.mjs"
      - "tools/music_qa_golden.mjs"
      - "tools/check_music_qa_golden.mjs"
      - "qa/baselines/**"
      - "tools/check_pulse_mastering.py"
      - "tools/check_pulse_audio_profile.py"
      - "tools/encode_pulse_audio.sh"
      - ".github/workflows/music-architecture-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce Music Facade boundary
        run: python tools/check_music_boundary.py
      - name: Check Pulse encoder shell syntax
        run: bash -n tools/encode_pulse_audio.sh
      - name: Check JavaScript syntax
        run: |
          node --check src/music-pack-manifest.js
          node --check src/audio-asset-cache.js
          node --check src/music-service-worker.js
          node --check music-sw.js
          node --check src/music-format-resolver.js
          node --check src/wav-stem-manager.js
          node --check src/music-registry.js
          node --check src/music-asset-resolver.js
          node --check src/music-facade.js
          node --check src/music-qa-report.js
          node --check src/music-qa-compare.js
          node --check src/music-qa-scenario.js
          node --check tools/music_qa_golden.mjs
          node --check src/game.js
          node --check games/orbit-rush/game.js
          node --check games/pulse-forge/game.js
          node --check games/rune-relay/game.js
          node --check games/aether-shift/game.js
          node --check debug/resolver/resolver.js
          node --check debug/mixer/mixer.js
          node --check debug/audio-qa/qa.js
          node --check settings/music/settings.js
      - name: Check Music Pack manifests
        run: node tools/check_music_manifests.mjs
      - name: Check Music Format Resolver
        run: node tools/check_music_formats.mjs
      - name: Check Runtime Decode Fallback
        run: node tools/check_music_runtime_fallback.mjs
      - name: Check Audio Preload Cache
        run: node tools/check_music_preload_cache.mjs
      - name: Check Persistent Audio Cache
        run: node tools/check_music_persistent_cache.mjs
      - name: Check Beat and Bar Quantization
        run: node tools/check_music_quantization.mjs
      - name: Check Transition Cue Engine
        run: node tools/check_music_transition_cues.mjs
      - name: Check Runtime Mastering Graph
        run: node tools/check_music_mastering.mjs
      - name: Check Realtime Audio Meter
        run: node tools/check_music_metering.mjs
      - name: Check QA Session Reports
        run: node tools/check_music_qa_report.mjs
      - name: Check QA Baseline Regression Compare
        run: node tools/check_music_qa_compare.mjs
      - name: Check Automated QA Scenario
        run: node tools/check_music_qa_scenario.mjs
      - name: Check Golden QA + Publish Summary
        env:
          GOLDEN_QA_REPORT_PATH: qa/out/pulse-standard-v1-golden-report.json
        run: node tools/music_qa_golden.mjs --check
      - name: Upload Golden QA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-golden-qa-report
          path: qa/out/pulse-standard-v1-golden-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Golden QA Gate Semantics
        run: node tools/check_music_qa_golden.mjs
      - name: Check Pulse Audio Profile
        run: python tools/check_pulse_audio_profile.py
      - name: Check Pulse Mastering
        run: python tools/check_pulse_mastering.py
