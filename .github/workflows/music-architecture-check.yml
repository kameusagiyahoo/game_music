name: Music Architecture Check

on:
  push:
    paths:
      - "src/**"
      - "games/**"
      - "tools/check_music_boundary.py"
      - ".github/workflows/music-architecture-check.yml"
  pull_request:
    paths:
      - "src/**"
      - "games/**"
      - "tools/check_music_boundary.py"
      - ".github/workflows/music-architecture-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce Music Resolver boundary
        run: python tools/check_music_boundary.py
