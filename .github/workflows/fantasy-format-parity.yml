name: Fantasy Audio Format Parity

on:
  push:
    paths:
      - "assets/stems/fantasy/**"
      - "assets/stingers/fantasy/**"
      - "assets/transitions/fantasy/**"
      - "tools/check_fantasy_format_parity.py"
      - "tools/check_fantasy_format_parity_semantics.py"
      - "tools/check_pulse_format_parity.py"
      - ".github/workflows/fantasy-format-parity.yml"
  pull_request:
    paths:
      - "assets/stems/fantasy/**"
      - "assets/stingers/fantasy/**"
      - "assets/transitions/fantasy/**"
      - "tools/check_fantasy_format_parity.py"
      - "tools/check_fantasy_format_parity_semantics.py"
      - "tools/check_pulse_format_parity.py"
      - ".github/workflows/fantasy-format-parity.yml"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check decoded Fantasy cross-format parity
        run: python tools/check_fantasy_format_parity.py
      - name: Check Fantasy parity gate semantics
        run: python tools/check_fantasy_format_parity_semantics.py
      - name: Upload Fantasy Format Parity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-format-parity-report
          path: qa/out/fantasy-format-parity.json
          if-no-files-found: ignore
          retention-days: 14
